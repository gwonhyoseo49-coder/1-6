<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤︎ 1-6 ❤︎</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #faf8f5;
  --text: #39352f;
  --sub: #918980;
  --line: #e9e3dc;
  --accent: #a88e7a;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Gowun Dodum', sans-serif;
}

button {
  font: inherit;
  cursor: pointer;
}

header {
  text-align: center;
  padding: 76px 20px 48px;
}

.heart {
  color: #bd8e8e;
  font-size: 19px;
  letter-spacing: 8px;
  margin-bottom: 18px;
}

h1 {
  font-family: 'Nanum Myeongjo', serif;
  font-size: clamp(36px, 7vw, 58px);
  font-weight: 400;
  letter-spacing: 2px;
  margin: 0;
}

.subtitle {
  color: var(--sub);
  font-size: 13px;
  letter-spacing: 1px;
  margin-top: 20px;
  line-height: 1.9;
}

.year-label {
  display: inline-block;
  margin-top: 27px;
  border: 1px solid var(--line);
  border-radius: 30px;
  padding: 8px 18px;
  color: var(--sub);
  font-size: 12px;
}

.divider {
  width: 36px;
  height: 1px;
  background: #c9b7a7;
  margin: 0 auto 45px;
}

main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 22px 90px;
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 26px;
}

.section-title {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 23px;
}

.count {
  color: var(--sub);
  font-size: 12px;
  margin-left: 8px;
}

.filters {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.filter {
  border: 1px solid var(--line);
  color: var(--sub);
  background: transparent;
  padding: 8px 13px;
  border-radius: 25px;
  font-size: 12px;
  transition: 0.2s;
}

.filter:hover,
.filter.active {
  background: var(--text);
  color: white;
  border-color: var(--text);
}

.gallery {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 30px 19px;
}

.photo-card {
  min-width: 0;
  cursor: pointer;
  animation: appear 0.4s ease both;
}

.photo-frame {
  width: 100%;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  background: #eee9e2;
  border-radius: 3px;
  position: relative;
}

.photo-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.5s;
}

.photo-card:hover img {
  transform: scale(1.04);
}

.photo-info {
  padding: 12px 2px 0;
}

.photo-date {
  font-size: 11px;
  color: var(--sub);
  margin-bottom: 5px;
}

.photo-caption {
  font-size: 14px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.photo-category {
  display: inline-block;
  color: #9b8572;
  background: #f0eae3;
  font-size: 10px;
  padding: 4px 8px;
  border-radius: 3px;
  margin-top: 8px;
}

.empty {
  grid-column: 1 / -1;
  text-align: center;
  color: var(--sub);
  padding: 80px 10px;
  line-height: 2;
}

footer {
  text-align: center;
  padding: 35px 20px 55px;
  border-top: 1px solid var(--line);
  color: var(--sub);
  font-size: 12px;
  line-height: 2;
}

footer .footer-heart {
  color: #bd8e8e;
  font-size: 17px;
  margin-bottom: 8px;
}

/* 사진 크게 보기 */
.modal {
  display: none;
  position: fixed;
  z-index: 10;
  inset: 0;
  background: rgba(28, 25, 22, 0.92);
  align-items: center;
  justify-content: center;
  padding: 22px;
}

.modal.show {
  display: flex;
}

.modal-content {
  max-width: 850px;
  width: 100%;
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.modal img {
  max-width: 100%;
  max-height: 76vh;
  object-fit: contain;
}

.modal-caption {
  color: white;
  text-align: center;
  font-size: 14px;
  line-height: 1.8;
  margin-top: 15px;
}

.close {
  position: fixed;
  top: 18px;
  right: 22px;
  background: none;
  border: none;
  color: white;
  font-size: 34px;
  font-weight: 300;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 650px) {
  header {
    padding-top: 65px;
  }

  main {
    padding-left: 15px;
    padding-right: 15px;
  }

  .gallery {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 23px 12px;
  }

  .toolbar {
    align-items: flex-start;
    flex-direction: column;
  }

  .filters {
    gap: 6px;
  }

  .filter {
    padding: 7px 11px;
  }
}

/* 사진이 없는 추억 메모 카드 */
.memo-frame {
  background: #f7f0e7;
  color: #6f5747;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  box-sizing: border-box;
}

.memo-content {
  width: 100%;
  min-height: 180px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  border: 1px dashed #d6c2ae;
  padding: 16px;
  box-sizing: border-box;
}

.memo-icon {
  font-size: 25px;
  margin-bottom: 8px;
}

.memo-label {
  font-size: 10px;
  letter-spacing: 2px;
  color: #ad8d73;
  margin-bottom: 12px;
}

.memo-title {
  font-family: "Nanum Myeongjo", serif;
  font-size: 17px;
  font-weight: bold;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.memo-description {
  font-size: 12px;
  line-height: 1.9;
  margin-top: 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.memo-heart {
  font-size: 18px;
  color: #c29d87;
  margin-top: 12px;
}

#modalMemoText {
  display: none;
  white-space: pre-wrap;
  line-height: 1.9;
  color: #6f5747;
  padding: 12px 4px;
  overflow-wrap: anywhere;
}

</style>
</head>

<body>

<header>
  <h1>❤︎ 1-6 ❤︎</h1>

  <p class="subtitle">
    우리의 열일곱, 함께했던 모든 순간<br>
    오래도록 기억하고 싶은 1년
  </p>

  <div class="year-label">2026. 03 — 2027. 02</div>
</header>

<div class="divider"></div>

<main>
  <div class="toolbar">
    <div>
      <span class="section-title">Our Memories</span>
      <span class="count" id="count"></span>
    </div>

    <div class="filters" id="filters"></div>
  </div>

  <div class="gallery" id="gallery"></div>
</main>

<footer>
  <div class="footer-heart">♡</div>
  1학년 6반의 소중한 기록<br>
</footer>

<div class="modal" id="modal" onclick="closeModal(event)">
  <button class="close" onclick="hideModal()" aria-label="닫기">×</button>
  <div class="modal-content">
    <img id="modalImage" src="" alt="확대된 추억 사진">
    <div class="modal-caption" id="modalCaption"></div>
  </div>
</div>

<script>
/*
  사진 추가 방법
  1. photos 폴더에 사진을 넣기
  2. 아래 목록에 사진 정보를 추가하기
  3. src에는 photos/사진파일명.jpg 입력하기

  month는 3월부터 12월까지 3~12,
  다음 해 1월과 2월은 13, 14로 입력하기
*/

const photos = [
  {
    src: "KakaoTalk_20261011_020028509.jpg",
    month: 4,
    date: "2026.04.02",
    caption: "첫 단체사진",
    category: "단체사진"
  },
  {
    src: "KakaoTalk_20261011_012729306.jpg",
    month: 4,
    date: "2026.04.07",
    caption: "학습 규칙 만들기",
    category: "학교생활"
  },
  {
    src: "KakaoTalk_20261011_012930874.jpg",
    month: 5,
    date: "2026.05.15",
    caption: "스승의 날&혜진쌤 생신",
    category: "단체사진"
  },
  {
    src: "KakaoTalk_20261011_012930874_01.jpg",
    month: 5,
    date: "2026.05.15",
    caption: "체육대회 1등",
    category: "학교생활"
  },
  {
    src: "KakaoTalk_20261011_012930874_04.jpg",
    month: 5,
    date: "2026.05.19",
    caption: "현장체험학습",
    category: "단체사진"
  },
  {
    src: "KakaoTalk_20261011_012930874_05.jpg",
    month: 6,
    date: "2026.06.18",
    caption: "혜진쌤이 사주신 음료",
    category: "이벤트"
  },
  {
    src: "KakaoTalk_20261011_012930874_06.jpg",
    month: 8,
    date: "2026.08.25",
    caption: "베이스볼 파이브 2등 보상",
    category: "학교생활"
  },
  {
    src: "KakaoTalk_20261011_012930874_07.jpg",
    month: 9,
    date: "2026.09.18",
    caption: "혜진쌤 임신 축하드립니다",
    category: "이벤트"
  },
  {
  type: "memo",
  month: 4,
  date: "2026.04.10",
  caption: "우리 반 학급 회의",
  description: "반 친구들과 학급 규칙에 대해 이야기했다. 서로 의견을 나누며 우리 반을 더 좋은 공간으로 만들어 가기로 했다.",
  category: "학교생활"
},
];

const monthNames = {
  3: "3월", 4: "4월", 5: "5월",
  6: "6월", 7: "7월", 8: "8월",
  9: "9월", 10: "10월", 11: "11월",
  12: "12월", 13: "2027년 1월", 14: "2027년 2월"
};

let currentFilter = "전체";

const filters = document.getElementById("filters");
const gallery = document.getElementById("gallery");
const count = document.getElementById("count");

function makeFilters() {
  const options = [
    "전체",
    "단체사진",
    "학교생활",
    ...Object.values(monthNames)
  ];

  filters.innerHTML = "";

  options.forEach(option => {
    const button = document.createElement("button");
    button.className =
      "filter" + (option === currentFilter ? " active" : "");
    button.textContent = option;

    button.onclick = () => {
      currentFilter = option;
      makeFilters();
      renderPhotos();
    };

    filters.appendChild(button);
  });
}

function renderPhotos() {
  gallery.innerHTML = "";

  const filtered = photos.filter(photo => {
    if (currentFilter === "전체") return true;
    if (currentFilter === photo.category) return true;
    return monthNames[photo.month] === currentFilter;
  });

  count.textContent = `(${filtered.length})`;

  if (filtered.length === 0) {
    gallery.innerHTML = `
      <div class="empty">
        아직 등록된 추억이 없어<br>
        이 달의 추억을 추가해 줘 ♡
      </div>
    `;
    return;
  }

  filtered.forEach(photo => {
    const card = document.createElement("div");
    card.className = photo.type === "memo"
      ? "photo-card memo-card"
      : "photo-card";

    const frame = document.createElement("div");
    frame.className = "photo-frame";

    if (photo.type === "memo") {
      frame.classList.add("memo-frame");
      frame.innerHTML = `
        <div class="memo-content">
          <div class="memo-icon">✎</div>
          <div class="memo-label">OUR MEMORY</div>
          <div class="memo-title"></div>
          <div class="memo-description"></div>
          <div class="memo-heart">♡</div>
        </div>
      `;

      frame.querySelector(".memo-title").textContent = photo.caption;
      frame.querySelector(".memo-description").textContent =
        photo.description || "";
    } else {
      const img = document.createElement("img");
      img.src = photo.src;
      img.alt = photo.caption;
      img.loading = "lazy";

      img.onerror = () => {
        img.style.display = "none";
        frame.style.background = "#eee9e2";
        frame.innerHTML = `
          <div style="
            height:100%;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#a69a8d;
            font-size:12px;
            text-align:center;
            padding:12px;
            line-height:2;">
            사진을 확인해 줘 ♡<br>
            ${photo.src}
          </div>
        `;
      };

      frame.appendChild(img);
    }

    const info = document.createElement("div");
    info.className = "photo-info";

    const date = document.createElement("div");
    date.className = "photo-date";
    date.textContent = photo.date;

    const caption = document.createElement("div");
    caption.className = "photo-caption";
    caption.textContent = photo.caption;

    const category = document.createElement("span");
    category.className = "photo-category";
    category.textContent = photo.category;

    info.append(date, caption, category);
    card.append(frame, info);

    if (photo.type === "memo") {
      card.onclick = () => {
        const modal = document.getElementById("modal");
        document.getElementById("modalImage").style.display = "none";
        document.getElementById("modalCaption").textContent =
          `${photo.date} · ${photo.caption}`;

        let memoText = document.getElementById("modalMemoText");

        if (!memoText) {
          memoText = document.createElement("div");
          memoText.id = "modalMemoText";
          document.getElementById("modalCaption").after(memoText);
        }

        memoText.textContent = photo.description || "";
        memoText.style.display = "block";
        modal.classList.add("show");
        document.body.style.overflow = "hidden";
      };
    } else {
      card.onclick = () => showModal(photo);
    }

    gallery.appendChild(card);
  });
}

function showModal(photo) {
  const modalImage = document.getElementById("modalImage");
  const modalCaption = document.getElementById("modalCaption");
  const modal = document.getElementById("modal");

  modalImage.style.display = "";
  modalImage.src = photo.src;
  modalCaption.textContent = `${photo.date} · ${photo.caption}`;

  const memoText = document.getElementById("modalMemoText");
  if (memoText) memoText.style.display = "none";

  modal.classList.add("show");
  document.body.style.overflow = "hidden";
}

function hideModal() {
  document.getElementById("modal").classList.remove("show");
  document.body.style.overflow = "";

  const memoText = document.getElementById("modalMemoText");
  if (memoText) memoText.style.display = "none";
}


function hideModal() {
  document.getElementById("modal").classList.remove("show");
  document.body.style.overflow = "";
}

function closeModal(event) {
  if (event.target.id === "modal") hideModal();
}

document.addEventListener("keydown", event => {
  if (event.key === "Escape") hideModal();
});

makeFilters();
renderPhotos();
</script>

</body>
</html>
